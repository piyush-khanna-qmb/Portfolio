<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050816" />
    <title>Piyush Khanna — Software & Applied AI Engineer, Robotics</title>
    <!--
      Description/canonical/OG/Twitter tags live in src/components/SEO.jsx
      (rendered per-route via react-helmet-async) instead of here, and get
      baked into static HTML per-route by scripts/prerender.mjs. Helmet
      only manages tags it creates itself, so duplicating the description
      meta tag here would leave two copies per prerendered page, and
      crawlers generally honor whichever copy comes first.
    -->

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Piyush Khanna",
        "url": "https://piyushkhanna.space/",
        "image": "https://piyushkhanna.space/og-image.jpg",
        "jobTitle": "Software and Applied AI Engineer",
        "description": "Software and Applied AI engineer specialising in IoT, harness engineering, and robotics. Founder & CEO of Emperia Smart Solutions.",
        "sameAs": [
          "https://www.linkedin.com/in/piyush-khanna-qmb/",
          "https://github.com/piyush-khanna-qmb/",
          "https://www.instagram.com/highonelixir/"
        ]
      }
    </script>

    <script>
      // Decodes the path the public/404.html shim re-encoded into a query
      // string (see that file for why), and restores the real URL via
      // history.replaceState before react-router mounts and reads it.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>

</html>
