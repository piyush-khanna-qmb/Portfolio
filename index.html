    <script>
      // Decodes the path the public/404.html shim re-encoded into a query
      // string (see that file for why), and restores the real URL via
      // history.replaceState before react-router mounts and reads it.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
