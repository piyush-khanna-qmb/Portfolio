<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <title>Piyush Khanna</title>
    <script>
      // GitHub Pages serves this file for any unknown path (e.g. a direct
      // hit on /thoughts/who-is-ganpat, which only exists as a client-side
      // route). It re-encodes the path into a query string and redirects
      // to the real index.html, which decodes it back below and hands off
      // to react-router — so deep links survive a hard refresh or a
      // crawler fetching the URL directly. pathSegmentsToKeep = 0 because
      // this is a custom domain served from the root, not a /repo-name/
      // GitHub Pages subpath.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
        "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>

  <body>
  </body>

</html>
